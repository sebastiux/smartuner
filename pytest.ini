[pytest]
# tests/ (pruebas unitarias) y src/ (ejemplos ">>>" de los docstrings: si un valor
# por defecto cambia y un ejemplo de la documentación queda obsoleto, falla).
testpaths = tests src
addopts = -q --doctest-modules
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
markers =
    slow: pruebas lentas (pipeline completo o GUI)
    gui: pruebas que abren ventanas de tkinter (requieren DISPLAY)
